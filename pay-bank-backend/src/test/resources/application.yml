spring:
  application:
    name: pay-bank-backend-test
  datasource:
    url: jdbc:hsqldb:mem:paybank;sql.syntax_pgs=true
    username: sa
    password:
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never

jwt:
  access-token-ttl: 15m
  refresh-token-ttl: 7d
  secret: "test-secret-with-at-least-32-characters!!"

auth:
  refresh-cookie:
    secure: true

cors:
  allowed-origins: http://localhost:4200
