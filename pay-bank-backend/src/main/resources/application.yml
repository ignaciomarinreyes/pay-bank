spring:
  application:
    name: pay-bank-backend
  config:
    # Local secrets (datasource password, jwt.secret). Git-ignored, see docs/constitution.md
    import: optional:file:./secret-local.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/pay_bank
    username: pay_bank
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  access-token-ttl: 15m
  refresh-token-ttl: 7d

auth:
  refresh-cookie:
    secure: true

cors:
  allowed-origins: http://localhost:4200
