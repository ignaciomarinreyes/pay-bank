openapi: 3.0.3
info:
  title: Pay Bank API
  description: Payments API that allows users to send payments and check their account, movements and balance.
  version: 0.0.1
servers:
  - url: http://localhost:8080
    description: Local environment
tags:
  - name: Auth
    description: Authentication
  - name: Users
    description: Users
  - name: Accounts
    description: Account, balance and movements
  - name: Payments
    description: Payments between users
paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with alias and password
      description: >
        Opens a session. Returns the access token in the body and sets the refresh token
        in an HttpOnly cookie (refresh_token).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session opened
          headers:
            Set-Cookie:
              description: refresh_token cookie (HttpOnly, SameSite=Strict, Path=/api/auth)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Renew the session
      description: >
        Uses the refresh_token cookie (single use) to issue a new access token and a new refresh token.
      security: []
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Session renewed
          headers:
            Set-Cookie:
              description: New refresh_token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Close the session
      description: Invalidates the refresh token on the server and clears the cookie. Idempotent.
      security: []
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Session closed
          headers:
            Set-Cookie:
              description: Cookie deletion (Max-Age=0)
              schema:
                type: string
  /api/accounts/me/movements:
    get:
      tags: [Accounts]
      operationId: getMyMovements
      summary: List the movements of the current user's account
      description: >
        Paginated history of charges and credits of the authenticated user's account,
        most recent first (createdAt descending, then id descending).
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page of movements (empty if there are none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    LoginRequest:
      type: object
      required: [alias, password]
      properties:
        alias:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, alias]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Access token lifetime in seconds
          example: 900
        alias:
          type: string
    MovementResponse:
      type: object
      required: [id, createdAt, type, amount, balanceAfter, counterpartyAlias, concept]
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
          description: Moment of the movement (UTC)
        type:
          type: string
          enum: [CHARGE, CREDIT]
        amount:
          type: number
          description: Amount with sign (negative for CHARGE, positive for CREDIT), 2 decimals
          example: -1234.56
        balanceAfter:
          type: number
          description: Account balance right after this movement, 2 decimals
          example: 150.00
        counterpartyAlias:
          type: string
          description: Recipient of the payment for a CHARGE, payer for a CREDIT
        concept:
          type: string
          nullable: true
    MovementPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MovementResponse'
        page:
          type: integer
          description: Zero-based page index
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Not authenticated or invalid credentials
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: []
