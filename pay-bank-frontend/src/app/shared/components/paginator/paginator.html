<nav class="paginator" aria-label="Paginación">
  <button
    class="paginator__button"
    type="button"
    [disabled]="page() <= 1"
    (click)="pageChange.emit(page() - 1)"
  >
    Anterior
  </button>
  <span class="paginator__status">Página {{ page() }} de {{ totalPages() }}</span>
  <button
    class="paginator__button"
    type="button"
    [disabled]="page() >= totalPages()"
    (click)="pageChange.emit(page() + 1)"
  >
    Siguiente
  </button>
</nav>
